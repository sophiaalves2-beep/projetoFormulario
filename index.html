<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de pesquisa - IFTO</title>
</head>
<body>
    <h1>Formulário de pesquisa Institucional</h1>

    <form action="">
        <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>
        <label for="gmail">Gmail</label>
            <input type="gmail" id="gmail" name="Gmail" required>
        <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="Telefone">
        <label for="opcoes">Selecione o seu vínculo</label required>
        <select name="opcoes" id="opcoes">
            <option value="Discente">Discente</option>
            <option value="Docente">Docente</option>
            <option value="tecnico-administrativo">Técnico Administrativo</option>
        </select>

    </form>
</body>
</html>
